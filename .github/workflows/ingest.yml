# Central ingestion and coverage as a batch job on an ephemeral runner, then a deploy of the catalog and the gateway.
#
#   restore state -> pipeline -> cycles of [drain -> export -> verify -> deploy (Cloudflare) -> save -> ack]
#
# The gateway (gateway/, a Cloudflare Worker) is the public address: it serves the exported catalog as static files,
# answers the coverage protocol, and holds new registrations until a run takes them (`drain`). A run acknowledges
# what it took only after its deploy published their status and its state is saved, so a failed run loses no request.
#
# Cycles (.github/scripts/ingest-cycles.sh): the drain works the queue for at most CYCLE_MINUTES, pulling the gateway
# every PULL_MINUTES, then the cycle publishes what it did and acknowledges it; cycles repeat while work is left and
# the run's window (RUN_MINUTES) lasts. So a package is published within a cycle of being worked, a registration that
# arrives mid-run joins it within minutes, and a cancelled run loses at most one cycle. A window that ends with work
# left starts the next run at once (`reason: continue`). Every run does the same work whatever started it (schedule,
# gateway, continuation): GitHub keeps one pending run per concurrency group and a new one cancels it, so no kind of
# run may carry work another lacks.
#
# State: the central store (UNSTALE_STORE: central/ state and caches, catalog/ published tree) is the only thing
# that must outlive a runner. It is kept as assets of a *draft* release tagged `catalog-state` in this repository, as
# generations of content-addressed members (central/src/state/snapshot.ts): `state-<stamp>.json`, the manifest,
# uploaded last (a generation without it is incomplete and ignored), naming where each member is in the segments
# `state-<stamp>.segNN` (under 1.5 GiB; the asset limit is 2 GiB). A save uploads only the members that changed, in one
# new segment, so a cycle's save is the size of its work, not of the store. A restore downloads the eager members
# (caches, the catalog, onboarding jobs: not what is kept per technology); a technology's docs store, and its records,
# release notes, advisories and docs metadata, are restored when first read, by the state server this step starts with
# the release token (the drain never holds it), and removed again by the cycle's save once saved, so the runner's disk
# holds the technologies of one cycle. A run saves once a cycle; the newest generation of each of the newest STATE_KEEP (3) runs is kept
# (rollback) with every segment it references, the rest is deleted after a successful save. A legacy tarball
# generation (`state-<stamp>.tar.zst.*` + `.sha256`) is still restored, and never deleted: reverting to the tarball
# code restores the last tarball, losing the state saved since the migration (an operator deletes the tarballs once
# they are not needed). Why not the
# alternatives: actions/cache is evicted after 7 days without access and shares a 10 GB repository limit, so it
# cannot be the only copy; a git branch would put churning caches into history (and hit the 100 MB file limit);
# artifacts expire. A draft release is durable, has no storage quota, is invisible to readers without push access,
# and is a plain download for a later move to another scheduler. Seeding it from an operator's store: CONTRIBUTING.md.
#
# Schedule: every 3 hours (the repository is public, so standard runners are free; a private one pays per minute, so
# run it daily there). Model calls are cached per record, so a run with no new
# releases makes none, and the coverage budget (UNSTALE_BUDGET_TOKENS, with each technology's quarterly tokens) bounds
# what any run can spend and so how fast new technologies drain; there is no daily count of them. The gateway may
# also start a run early for a new package (`reason: fast-track`, at most FAST_TRACK_PER_DAY a day), but not while the
# budget is spent (each drain tells the gateway until when), nor while a run is pulling the queue (it takes the
# package within minutes; the gateway starts the held-back run when that run says it is done).
#
# 60-day rule: GitHub disables scheduled workflows in a public repository after 60 days without repository
# activity. This job commits nothing (state lives in release assets), so it does not count as activity. When the
# schedule is disabled, re-enable it under Actions > ingest > "Enable workflow" (or `gh workflow enable
# ingest.yml`); workflow_dispatch keeps working meanwhile.
name: ingest

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      tech:
        description: "Only this catalog technology in the pipeline step (e.g. next); empty for all"
        required: false
        type: string
      bootstrap:
        description: "No saved state yet: start from an empty store (full re-ingestion, every model call uncached)"
        required: false
        type: boolean
        default: false
      deploy:
        description: "Deploy the exported catalog and the gateway"
        required: false
        type: boolean
        default: true
      concurrency:
        description: "Drain slots (jobs at once; a third, at least one, kept for new technologies); empty for the default"
        required: false
        type: string
      reason:
        description: "Why the run started (the gateway sends fast-track; a run that ends with work left, continue)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Under the 6-hour hosted-job limit: setup, the pipeline (120) and the cycles (190) fit, so the state is saved.
    timeout-minutes: 345
    permissions:
      contents: write # the catalog-state draft release (read and write its assets)
    outputs:
      continue: ${{ steps.cycles.outputs.continue }}
    env:
      STATE_TAG: catalog-state
      STATE_KEEP: "3"
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }} # state release only; ingestion reads GitHub with INGEST_GITHUB_TOKEN
      # Extraction and the classifier's fallback use central's default model, gpt-6-luna through the AI gateway (flex
      # tier). Release-note tokens a UTC day: 2.5M is tens of cents at the measured rate (a pipeline run's 660k input
      # and 266k output extraction tokens cost $0.11); 250k was spent by 08:00 UTC and left later runs nothing to start.
      UNSTALE_BUDGET_TOKENS: ${{ vars.UNSTALE_BUDGET_TOKENS || '2500000' }}
      UNSTALE_GATEWAY_URL: ${{ vars.UNSTALE_GATEWAY_URL }}
      # Workers static assets allow 20,000 files per version on the free plan (100,000 paid); the deploy packs what does
      # not fit into at most 4,096 bucket files the gateway reads (gateway/src/pack.ts). The pack fails instead if files
      # it cannot pack leave no room under the limit or a bucket would exceed Workers' 25 MiB file limit.
      ASSET_FILE_LIMIT: ${{ vars.ASSET_FILE_LIMIT || '20000' }}
      # A run's drain window, in cycles that each publish (see the header). 15-minute cycles with 5-minute pulls put a
      # package worked at the head of the queue in the catalog about 10-25 minutes after it was registered.
      RUN_MINUTES: "140"
      CYCLE_MINUTES: "15"
      GRACE_MINUTES: "5"
      PULL_MINUTES: "5"
      # Drain slots. A continuation or scheduled run takes the default: an input applies to the run it was given to.
      CONCURRENCY: ${{ inputs.concurrency || '6' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Required secrets are set
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_DRAIN_TOKEN: ${{ secrets.GATEWAY_DRAIN_TOKEN }}
          INGEST_GITHUB_TOKEN: ${{ secrets.INGEST_GITHUB_TOKEN }}
          UNSTALE_SIGNING_KEY: ${{ secrets.UNSTALE_SIGNING_KEY }}
          UNSTALE_CATALOG_KEY: ${{ vars.UNSTALE_CATALOG_KEY }}
        run: |
          missing=0
          for name in JEV_API_KEY AI_GATEWAY_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GATEWAY_DRAIN_TOKEN UNSTALE_SIGNING_KEY UNSTALE_CATALOG_KEY; do
            if [ -z "${!name}" ]; then echo "::error title=Missing secret::$name is not set"; missing=1; fi
          done
          if [ -z "$INGEST_GITHUB_TOKEN" ]; then
            echo "::warning title=INGEST_GITHUB_TOKEN not set::Reading GitHub with the workflow token (1,000 requests an hour)."
          fi
          if [ -z "$UNSTALE_GATEWAY_URL" ]; then
            echo "::warning title=UNSTALE_GATEWAY_URL not set::Registrations are not pulled; only the saved queue is worked."
          fi
          exit "$missing"

      - name: Paths
        run: |
          {
            echo "UNSTALE_STORE=$RUNNER_TEMP/store"
            echo "SITE_DIR=$RUNNER_TEMP/site"
            echo "TAKEN=$RUNNER_TEMP/taken.json"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            central/package-lock.json
            gateway/package-lock.json
      - name: npm ci
        run: |
          npm ci --prefix central --no-audit --no-fund
          npm ci --prefix gateway --no-audit --no-fund

      # The eager members of the newest complete generation, then the state server that restores a technology's docs
      # store when the pipeline or the drain first reads it (UNSTALE_STATE_SOCKET; it runs until the job ends).
      - name: Restore state
        id: restore
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          set -euo pipefail
          mkdir -p "$UNSTALE_STORE"
          rels="$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft and .tag_name == env.STATE_TAG) | .id')"
          rel="${rels%%$'\n'*}"
          if [ -z "$rel" ]; then
            if [ "$BOOTSTRAP" != "true" ]; then
              echo "::error title=No saved state::No draft release '$STATE_TAG'. Seed it from an operator store (CONTRIBUTING.md) or run this workflow with bootstrap=true."
              exit 1
            fi
            rel="$(gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$STATE_TAG" -F draft=true \
              -f name="catalog state" -f body="Central store snapshots for the ingest workflow. Do not publish." --jq .id)"
            echo "::warning::Created draft release $STATE_TAG; starting from an empty store."
          fi
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          export UNSTALE_STATE_REMOTE="github:$GH_REPO#$rel"
          echo "UNSTALE_STATE_REMOTE=$UNSTALE_STATE_REMOTE" >> "$GITHUB_ENV"
          status=0
          npm --prefix central run -s state -- restore || status=$?
          if [ "$status" -eq 3 ]; then
            if [ "$BOOTSTRAP" != "true" ]; then
              echo "::error title=No saved state::Release '$STATE_TAG' has no complete generation (no state-*.json or state-*.sha256)."
              exit 1
            fi
            echo "::warning::No saved generation; starting from an empty store."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          sock="$RUNNER_TEMP/state.sock"
          nohup npm --prefix central run -s state -- serve --socket "$sock" > "$RUNNER_TEMP/state-serve.log" 2>&1 &
          for _ in $(seq 1 60); do [ -S "$sock" ] && break; sleep 1; done
          [ -S "$sock" ] || { cat "$RUNNER_TEMP/state-serve.log"; echo "::error::The state server did not start"; exit 1; }
          echo "UNSTALE_STATE_SOCKET=$sock" >> "$GITHUB_ENV"
          du -sh "$UNSTALE_STORE"/* 2>/dev/null || true

      # The catalog technologies (pipeline/technologies.ts): release notes, upgrade guides, docs and advisories. On
      # every run (cached model calls make a run with no new release cost about 20 seconds): a run of any kind may
      # replace a pending scheduled one.
      - name: Pipeline
        id: pipeline
        timeout-minutes: 120
        env:
          GITHUB_TOKEN: ${{ secrets.INGEST_GITHUB_TOKEN || github.token }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          TECH: ${{ inputs.tech }}
        run: npm --prefix central run pipeline -- --refresh ${TECH:+--tech "$TECH"}

      # Every other technology: registrations pulled from the gateway join the saved queue (and keep joining it during
      # the run), then refreshes and admitted history first, new technologies by demand (ties by adoption, one slot in
      # three kept for a waiting new technology), all under the coverage budget. Each cycle exports and verifies the
      # static catalog (with every job's status), builds the website (gateway/site/build.ts), deploys both, saves the
      # state and acknowledges what it took. The run reports its progress to the gateway (running, publishing) on the
      # new packages it works, so a client that asked can follow it. When a budget limit held work back, a drain's
      # final line's `held` names it and when it resets. Pruning of shards past their 7-day grace happens in export,
      # before the save (the grace bookkeeping lives in the store).
      - name: Drain and publish
        id: cycles
        if: always() && steps.restore.outcome == 'success' && (steps.pipeline.outcome == 'success' || steps.pipeline.outcome == 'failure')
        # RUN_MINUTES (140) + the last cycle's grace (5) + about a minute of publish per cycle (10), with slack.
        timeout-minutes: 190
        env:
          GITHUB_TOKEN: ${{ secrets.INGEST_GITHUB_TOKEN || github.token }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          UNSTALE_GATEWAY_TOKEN: ${{ secrets.GATEWAY_DRAIN_TOKEN }}
          # Ed25519 private key (PKCS#8 PEM): the root and every index are signed; release clients refuse unsigned ones.
          SECRET_SIGNING_KEY: ${{ secrets.UNSTALE_SIGNING_KEY }}
          SECRET_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRET_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UNSTALE_CATALOG_KEY: ${{ vars.UNSTALE_CATALOG_KEY }}
          PIPELINE_OK: ${{ steps.pipeline.outcome == 'success' }}
          DEPLOY: ${{ github.event_name == 'schedule' || inputs.deploy }}
        run: bash .github/scripts/ingest-cycles.sh

      - name: Usage
        if: always() && steps.restore.outcome == 'success'
        run: |
          npm --prefix central run catalog -- usage | tail -c 8000 || true
          npm --prefix central run catalog -- jev-usage || true
          echo "docs stores restored on first use: $(grep -c '] restored docs:' "$RUNNER_TEMP/state-serve.log" || true)"
          echo "technologies restored on first use: $(grep -c '] restored tech:' "$RUNNER_TEMP/state-serve.log" || true)"

  # A run whose window ended with work left starts the next one at once. A job of its own, so the token that can start
  # workflows (actions: write) is never in the ingest job, whose GITHUB_TOKEN falls back to the job token. The new run
  # waits in the concurrency group until this one ends.
  continue:
    needs: ingest
    # always(): a run whose pipeline step failed still publishes its cycles, and its work left continues the same way.
    if: always() && needs.ingest.outputs.continue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # The ingest run did not tell the gateway it was done (the next run pulls soon): if the next run cannot be
      # started, say so now, so the gateway starts early runs again (`drain idle`'s report) instead of waiting out its
      # 15 minutes.
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          UNSTALE_GATEWAY_URL: ${{ vars.UNSTALE_GATEWAY_URL }}
          UNSTALE_GATEWAY_TOKEN: ${{ secrets.GATEWAY_DRAIN_TOKEN }}
        run: |
          gh workflow run ingest.yml --repo "$GH_REPO" --ref "$REF" -f reason=continue && exit 0
          if [ -n "$UNSTALE_GATEWAY_URL" ]; then
            curl -fsS --retry 3 -X POST -H "Authorization: Bearer $UNSTALE_GATEWAY_TOKEN" -H "Content-Type: application/json" \
              -d '{"updates":[],"pulls":{"next":null}}' "${UNSTALE_GATEWAY_URL%/}/internal/progress" || true
          fi
          exit 1
