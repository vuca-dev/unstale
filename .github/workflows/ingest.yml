# Central ingestion and coverage as a batch job on an ephemeral runner, then a deploy of the catalog and the gateway.
#
#   restore state -> pipeline -> drain the coverage queue -> export -> verify -> deploy (Cloudflare) -> save -> ack
#
# The gateway (gateway/, a Cloudflare Worker) is the public address: it serves the exported catalog as static files,
# answers the coverage protocol, and holds new registrations until a run takes them (`drain`). A run acknowledges
# what it took only after its deploy published their status and its state is saved, so a failed run loses no request
# (vault: Central Scheduling and Infrastructure, "Registration gateway").
#
# State: the central store (UNSTALE_STORE: central/ state and caches, catalog/ published tree) is the only thing
# that must outlive a runner. It is kept as assets of a *draft* release tagged `catalog-state` in this repository:
# one generation = `state-<stamp>.tar.zst.<aa,ab,...>` (zstd tarball split under the 2 GiB asset limit) plus
# `state-<stamp>.sha256`, uploaded last, so a generation without its checksum file is incomplete and ignored. The
# newest three generations are kept (rollback); older ones are deleted after a successful save. Why not the
# alternatives: actions/cache is evicted after 7 days without access and shares a 10 GB repository limit, so it
# cannot be the only copy; a git branch would put churning caches into history (and hit the 100 MB file limit);
# artifacts expire. A draft release is durable, has no storage quota, is invisible to readers without push access,
# and is a plain download for a later move to another scheduler (vault: Central Scheduling and Infrastructure,
# "Portability stance"). Seeding it from an operator's store: CONTRIBUTING.md.
#
# Schedule: every 3 hours (the repository is public, so standard runners are free; a private one pays per minute, so
# run it daily there). Model calls are cached per record, so a run with no new
# releases makes none, and the coverage budget (UNSTALE_BUDGET_TOKENS) bounds what any run can spend. The gateway may
# also start a run early for a new package (`reason: fast-track`, at most FAST_TRACK_PER_DAY a day).
#
# 60-day rule: GitHub disables scheduled workflows in a public repository after 60 days without repository
# activity. This job commits nothing (state lives in release assets), so it does not count as activity. When the
# schedule is disabled, re-enable it under Actions > ingest > "Enable workflow" (or `gh workflow enable
# ingest.yml`); workflow_dispatch keeps working meanwhile.
name: ingest

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      tech:
        description: "Only this catalog technology in the pipeline step (e.g. next); empty for all"
        required: false
        type: string
      bootstrap:
        description: "No saved state yet: start from an empty store (full re-ingestion, every model call uncached)"
        required: false
        type: boolean
        default: false
      deploy:
        description: "Deploy the exported catalog and the gateway"
        required: false
        type: boolean
        default: true
      reason:
        description: "Why the run started (the gateway sends fast-track)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Under the 6-hour hosted-job limit, with the pipeline and drain capped lower so the state is still saved.
    timeout-minutes: 300
    permissions:
      contents: write # the catalog-state draft release (read and write its assets)
    env:
      STATE_TAG: catalog-state
      STATE_KEEP: "3"
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }} # state release only; ingestion reads GitHub with INGEST_GITHUB_TOKEN
      # Extraction and the classifier's fallback use central's default model, gpt-6-luna through the AI gateway (flex
      # tier; vault: Implementation Decisions, "Extraction model switch").
      UNSTALE_BUDGET_TOKENS: ${{ vars.UNSTALE_BUDGET_TOKENS || '250000' }}
      UNSTALE_GATEWAY_URL: ${{ vars.UNSTALE_GATEWAY_URL }}
      # Workers static assets allow 20,000 files per version on the free plan (100,000 paid).
      ASSET_FILE_LIMIT: ${{ vars.ASSET_FILE_LIMIT || '20000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Required secrets are set
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_DRAIN_TOKEN: ${{ secrets.GATEWAY_DRAIN_TOKEN }}
          INGEST_GITHUB_TOKEN: ${{ secrets.INGEST_GITHUB_TOKEN }}
          UNSTALE_SIGNING_KEY: ${{ secrets.UNSTALE_SIGNING_KEY }}
          UNSTALE_CATALOG_KEY: ${{ vars.UNSTALE_CATALOG_KEY }}
        run: |
          missing=0
          for name in JEV_API_KEY AI_GATEWAY_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GATEWAY_DRAIN_TOKEN UNSTALE_SIGNING_KEY UNSTALE_CATALOG_KEY; do
            if [ -z "${!name}" ]; then echo "::error title=Missing secret::$name is not set"; missing=1; fi
          done
          if [ -z "$INGEST_GITHUB_TOKEN" ]; then
            echo "::warning title=INGEST_GITHUB_TOKEN not set::Reading GitHub with the workflow token (1,000 requests an hour)."
          fi
          if [ -z "$UNSTALE_GATEWAY_URL" ]; then
            echo "::warning title=UNSTALE_GATEWAY_URL not set::Registrations are not pulled; only the saved queue is worked."
          fi
          exit "$missing"

      - name: Paths
        run: |
          {
            echo "UNSTALE_STORE=$RUNNER_TEMP/store"
            echo "SITE_DIR=$RUNNER_TEMP/site"
            echo "TAKEN=$RUNNER_TEMP/taken.json"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            central/package-lock.json
            gateway/package-lock.json
      - name: npm ci
        run: |
          npm ci --prefix central --no-audit --no-fund
          npm ci --prefix gateway --no-audit --no-fund

      - name: Restore state
        id: restore
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          set -euo pipefail
          mkdir -p "$UNSTALE_STORE"
          rels="$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft and .tag_name == env.STATE_TAG) | .id')"
          rel="${rels%%$'\n'*}"
          if [ -z "$rel" ]; then
            if [ "$BOOTSTRAP" != "true" ]; then
              echo "::error title=No saved state::No draft release '$STATE_TAG'. Seed it from an operator store (CONTRIBUTING.md) or run this workflow with bootstrap=true."
              exit 1
            fi
            rel="$(gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$STATE_TAG" -F draft=true \
              -f name="catalog state" -f body="Central store snapshots for the ingest workflow. Do not publish." --jq .id)"
            echo "::warning::Created draft release $STATE_TAG; starting from an empty store."
            echo "release=$rel" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          gh api "repos/$GH_REPO/releases/$rel/assets?per_page=100" --paginate --jq '.[] | "\(.id)\t\(.name)"' > "$RUNNER_TEMP/assets.tsv"
          manifest="$(cut -f2 "$RUNNER_TEMP/assets.tsv" | grep -E '^state-.*\.sha256$' | sort | tail -1 || true)"
          if [ -z "$manifest" ]; then
            if [ "$BOOTSTRAP" != "true" ]; then
              echo "::error title=No saved state::Release '$STATE_TAG' has no complete generation (no state-*.sha256)."
              exit 1
            fi
            echo "::warning::No saved generation; starting from an empty store."
            exit 0
          fi
          gen="${manifest%.sha256}"
          echo "restoring $gen"
          dl="$RUNNER_TEMP/state-in"; mkdir -p "$dl"
          while IFS=$'\t' read -r id name; do
            case "$name" in "$gen".*)
              curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
                -o "$dl/$name" "$GITHUB_API_URL/repos/$GH_REPO/releases/assets/$id" ;;
            esac
          done < "$RUNNER_TEMP/assets.tsv"
          (cd "$dl" && sha256sum -c "$manifest")
          find "$dl" -name "$gen.tar.zst.*" | sort | xargs cat | zstd -d -q | tar -x -C "$UNSTALE_STORE"
          # A store archived on macOS carries AppleDouble `._*` entries (extended attributes), which GNU tar extracts
          # as files: `._<job>.json` would be read as a job.
          find "$UNSTALE_STORE" -name '._*' -type f -delete
          rm -rf "$dl"
          du -sh "$UNSTALE_STORE"/*

      # The catalog technologies (pipeline/technologies.ts): release notes, upgrade guides, docs and advisories.
      # Not on a fast-track run (the gateway started it for a new package): refreshes are the schedule's.
      - name: Pipeline
        id: pipeline
        if: inputs.reason != 'fast-track'
        timeout-minutes: 120
        env:
          GITHUB_TOKEN: ${{ secrets.INGEST_GITHUB_TOKEN || github.token }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          TECH: ${{ inputs.tech }}
        run: npm --prefix central run pipeline -- --refresh ${TECH:+--tech "$TECH"}

      # Every other technology: registrations pulled from the gateway join the saved queue, then refreshes and
      # admitted history first, new technologies by demand, all under the coverage budget. Writes each job's status.
      # A fast-track run works a pulled package only if it is next in the line of new technologies (it never jumps
      # the queue); otherwise it ran nothing (`ran=false`), and nothing is exported, saved or acknowledged, so the
      # gateway keeps the request for the next scheduled run.
      - name: Drain the coverage queue
        id: drain
        if: always() && (steps.pipeline.outcome == 'success' || steps.pipeline.outcome == 'failure' || steps.pipeline.outcome == 'skipped')
        timeout-minutes: 150
        env:
          GITHUB_TOKEN: ${{ secrets.INGEST_GITHUB_TOKEN || github.token }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          UNSTALE_GATEWAY_TOKEN: ${{ secrets.GATEWAY_DRAIN_TOKEN }}
          FAST: ${{ inputs.reason == 'fast-track' && 'true' || '' }}
        run: |
          set -o pipefail
          npm --prefix central run -s drain -- --minutes 130 --grace-minutes 10 --concurrency 6 --taken "$TAKEN" ${FAST:+--fast-track} \
            | tee "$RUNNER_TEMP/drain.log"
          echo "ran=$(tail -n 1 "$RUNNER_TEMP/drain.log" | jq -r 'if .ran == false then "false" else "true" end')" >> "$GITHUB_OUTPUT"

      # Writes a self-contained static tree (with the coverage statuses) and prunes shards past their 7-day grace
      # period (the grace bookkeeping lives in the store, so this runs before the state is saved).
      - name: Export the static catalog
        id: export
        if: (steps.pipeline.outcome == 'success' || steps.pipeline.outcome == 'skipped') && steps.drain.outcome == 'success' && steps.drain.outputs.ran == 'true'
        env:
          # Ed25519 private key (PKCS#8 PEM): the root and every index are signed; release clients refuse unsigned ones.
          UNSTALE_SIGNING_KEY: ${{ secrets.UNSTALE_SIGNING_KEY }}
        run: npm --prefix central run catalog -- export "$SITE_DIR"

      # Guard: deploy only a tree whose root parses and whose every index entry has its shard, with the size and
      # sha256 the index states, whose root and indexes verify against the public key release clients carry
      # (UNSTALE_CATALOG_KEY; a client verifies the same), and which fits the static asset limits.
      - name: Verify the exported catalog
        id: verify
        if: steps.export.outcome == 'success'
        env:
          DEPLOY: ${{ github.event_name == 'schedule' || inputs.deploy }}
          UNSTALE_CATALOG_KEY: ${{ vars.UNSTALE_CATALOG_KEY }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
          node --input-type=module -e '
            import { createHash, createPublicKey, verify } from "node:crypto";
            import { readFileSync, readdirSync } from "node:fs";
            import { join } from "node:path";
            const site = process.env.SITE_DIR;
            const key = createPublicKey({ key: { kty: "OKP", crv: "Ed25519", x: Buffer.from(process.env.UNSTALE_CATALOG_KEY, "hex").toString("base64url") }, format: "jwk" });
            const signed = (rel) => {
              const sig = Buffer.from(readFileSync(join(site, `${rel}.sig`), "utf8").trim(), "hex");
              if (!verify(null, readFileSync(join(site, rel)), key, sig)) throw new Error(`${rel}: signature does not verify against UNSTALE_CATALOG_KEY`);
            };
            signed("v1/root.json");
            const root = JSON.parse(readFileSync(join(site, "v1", "root.json"), "utf8"));
            if (typeof root.schema !== "number") throw new Error("v1/root.json has no schema");
            const techs = readdirSync(join(site, "v1", "tech")).filter((f) => f.endsWith(".json"));
            if (!techs.length) throw new Error("no technology indexes");
            let shards = 0;
            for (const f of techs) {
              signed(`v1/tech/${f}`);
              const index = JSON.parse(readFileSync(join(site, "v1", "tech", f), "utf8"));
              for (const s of index.shards ?? []) {
                const bytes = readFileSync(join(site, s.path));
                if (bytes.length !== s.bytes) throw new Error(`${s.path}: ${bytes.length} bytes, index says ${s.bytes}`);
                const sha = createHash("sha256").update(bytes).digest("hex");
                if (sha !== s.sha256) throw new Error(`${s.path}: sha256 ${sha}, index says ${s.sha256}`);
                shards++;
              }
            }
            console.log(`${techs.length} technologies, ${shards} shards verified, root and indexes signed`);
          '
          files="$(find "$SITE_DIR" -type f | wc -l)"
          big="$(find "$SITE_DIR" -type f -size +25M | wc -l)"
          echo "site: $files files, $(du -sh "$SITE_DIR" | cut -f1)"
          [ "$files" -le "$ASSET_FILE_LIMIT" ] || { echo "::error::$files files, over the $ASSET_FILE_LIMIT static asset limit"; exit 1; }
          [ "$big" -eq 0 ] || { echo "::error::$big files over the 25 MiB static asset limit"; exit 1; }
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"

      - name: Deploy the catalog and the gateway
        id: deploy
        if: steps.verify.outputs.deploy == 'true'
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy --assets "$SITE_DIR"

      # Saved after a failed pipeline or drain too: writes are atomic per file, stale technology locks are detected
      # by pid, and the model calls a partial run paid for are kept. Not saved when a step was cancelled or skipped.
      # Dead parts of an operator's store (the parked rarity sample's clones, the retired onboarding documents) and the
      # day's shared docs page cache stay out.
      - name: Save state
        id: save
        if: always() && steps.restore.outcome == 'success' && (steps.pipeline.outcome == 'success' || steps.pipeline.outcome == 'failure' || steps.pipeline.outcome == 'skipped') && (steps.drain.outcome == 'failure' || (steps.drain.outcome == 'success' && steps.drain.outputs.ran == 'true'))
        env:
          REL: ${{ steps.restore.outputs.release }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gen="state-$stamp"
          out="$RUNNER_TEMP/state-out"; rm -rf "$out"; mkdir -p "$out"
          tar -C "$UNSTALE_STORE" --exclude='./central/records/*.lock' --exclude='./central/sample' \
            --exclude='./central/onboarding/documents' --exclude='./central/cache/pages' -cf - . \
            | zstd -T0 -10 -q | split -b 1900m -a 2 - "$out/$gen.tar.zst."
          (cd "$out" && sha256sum "$gen".tar.zst.* > "$gen.sha256")
          ls -l "$out"
          upload() {
            curl -fsS --retry 3 -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              -T "$1" "https://uploads.github.com/repos/$GH_REPO/releases/$REL/assets?name=$(basename "$1")" > /dev/null
          }
          for f in "$out/$gen".tar.zst.*; do upload "$f"; done
          upload "$out/$gen.sha256" # last: marks the generation complete
          # Keep the newest STATE_KEEP complete generations; delete everything else (older ones, and parts left by an
          # interrupted save).
          gh api "repos/$GH_REPO/releases/$REL/assets?per_page=100" --paginate --jq '.[] | "\(.id)\t\(.name)"' > "$RUNNER_TEMP/assets.tsv"
          keep="$(cut -f2 "$RUNNER_TEMP/assets.tsv" | grep -E '^state-.*\.sha256$' | sort | tail -n "$STATE_KEEP" | sed 's/\.sha256$//')"
          while IFS=$'\t' read -r id name; do
            g="${name%.sha256}"; g="${g%.tar.zst.*}"
            if ! grep -qxF "$g" <<< "$keep"; then
              echo "deleting $name"
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$id"
            fi
          done < "$RUNNER_TEMP/assets.tsv"

      # The gateway stops holding what this run took: their status is deployed and the jobs are in the saved state.
      - name: Acknowledge the taken registrations
        if: steps.deploy.outcome == 'success' && steps.save.outcome == 'success'
        env:
          UNSTALE_GATEWAY_TOKEN: ${{ secrets.GATEWAY_DRAIN_TOKEN }}
        run: npm --prefix central run drain -- ack "$TAKEN"

      - name: Usage
        if: always() && steps.restore.outcome == 'success'
        run: npm --prefix central run catalog -- usage | tail -c 4000 || true
