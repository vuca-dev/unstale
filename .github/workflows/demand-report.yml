# Read-only aggregate report. No package names, addresses, IDs, headers or queue contents are printed.
name: demand-report
on:
  schedule:
    - cron: "10 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demand-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - name: Daily aggregate demand
        env:
          GATEWAY: ${{ vars.UNSTALE_DEFAULT_SERVICE || 'https://api.unstale.sh' }}
          DRAIN_TOKEN: ${{ secrets.GATEWAY_DRAIN_TOKEN }}
        run: node gateway/scripts/demand-report.ts
