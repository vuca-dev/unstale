[package]
name = "unstale"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
description = "The local half of unstale: stack detection, catalog sync, the relevance funnel, the ledger and the review skill files."

[[bin]]
name = "unstale"
path = "src/main.rs"

[dependencies]
unstale-schema = { path = "../schema" }
anyhow = "1"
aho-corasick = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
ignore = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Ed25519 verification of the signed catalog; already in the build through rustls.
ring = "0.17"
# Blocking HTTP for http(s) catalogs; rustls (ring) with webpki roots, no gzip so shard bytes stay as published.
ureq = { version = "3", default-features = false, features = ["rustls"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
tempfile = "3"
